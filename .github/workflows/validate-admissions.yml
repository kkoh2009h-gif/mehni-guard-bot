name: Validate admissions data
on:
  push:
    paths:
      - "edu_bot.py"
      - "admissions_2026_2027.json"
      - "scripts/validate_admissions.py"
      - ".github/workflows/validate-admissions.yml"
  pull_request:
    paths:
      - "edu_bot.py"
      - "admissions_2026_2027.json"
      - "scripts/validate_admissions.py"
      - ".github/workflows/validate-admissions.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot
        run: python -m py_compile edu_bot.py
      - name: Validate official admissions registry
        run: python scripts/validate_admissions.py
